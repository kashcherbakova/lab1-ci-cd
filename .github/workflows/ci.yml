
name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

  workflow_dispatch:

jobs:
  build-n-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

  docker-pack-n-push:
    name: Build and Publish Docker Image
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: shcherbakovaekaterina77/lab1-fastapi
      tag: latest
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
